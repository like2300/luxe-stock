{% for field in form %}
<div class="field {% if field.widget_type == 'checkbox' %}check{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label>{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<small class="err">{{ e }}</small>{% endfor %}
</div>
{% endfor %}
{% for e in form.non_field_errors %}<div class="alert error">{{ e }}</div>{% endfor %}
