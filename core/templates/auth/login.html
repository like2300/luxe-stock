<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Connexion - Luxe Dashboard</title>

        <!-- Fonts: Montserrat (Sans) & Playfair Display (Serif) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Iconify -->
        <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: "#5802f7",
                            dark: "#1a1a1a",
                        },
                        fontFamily: {
                            sans: ["Montserrat", "sans-serif"],
                            serif: ["Playfair Display", "serif"],
                        },
                    },
                },
            };
        </script>

        <style>
            .glass {
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.5);
            }
        </style>
    </head>
    <body class="bg-slate-50 text-slate-600 font-sans antialiased">
        <div
            class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-50 to-slate-100"
        >
            <div
                class="w-full max-w-md p-8 space-y-8 glass rounded-2xl shadow-xl border border-slate-100"
            >
                <div class="text-center">
                    <div class="flex justify-center mb-6">
                        <div
                            class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30"
                        >
                            <span class="text-lg font-semibold font-poppins"
                                >H</span
                            >
                        </div>
                    </div>
                    <h1 class="text-3xl font-bold text-dark font-poppins">
                        Bienvenue sur Luxe
                    </h1>
                    <p class="text-slate-500 mt-2">
                        Connectez-vous pour accéder à votre tableau de bord.
                    </p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="space-y-6">
                        <div>
                            <label
                                for="username"
                                class="block text-sm font-medium text-slate-700 mb-1"
                                >Nom d'utilisateur</label
                            >
                            <input
                                type="text"
                                name="username"
                                id="username"
                                required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-white/80"
                            />
                        </div>

                        <div>
                            <label
                                for="password"
                                class="block text-sm font-medium text-slate-700 mb-1"
                                >Mot de passe</label
                            >
                            <input
                                type="password"
                                name="password"
                                id="password"
                                required
                                class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-white/80"
                            />
                        </div>

                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input
                                    id="remember"
                                    name="remember"
                                    type="checkbox"
                                    class="h-4 w-4 text-primary focus:ring-primary border-slate-300 rounded"
                                />
                                <label
                                    for="remember"
                                    class="ml-2 block text-sm text-slate-700"
                                    >Se souvenir de moi</label
                                >
                            </div>

                            <div class="text-sm">
                                <a
                                    href="{% url 'password_reset' %}"
                                    class="font-medium text-primary hover:text-primary/80"
                                >
                                    Mot de passe oublié ?
                                </a>
                            </div>
                        </div>

                        <div>
                            <button
                                type="submit"
                                class="w-full flex justify-center px-4 py-3 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all"
                            >
                                Se connecter
                            </button>
                        </div>
                    </div>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-slate-50 text-slate-500"
                            >Ou connectez-vous avec</span
                        >
                    </div>
                </div>

                <div class="flex justify-center space-x-4">
                    {% include "auth/_google_btn.html" with g_label="Se connecter avec Google" %}
                </div>
            </div>
        </div>
    </body>
</html>
