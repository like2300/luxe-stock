<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Réinitialiser le Mot de Passe - Luxe</title>



    <!-- Fonts: Montserrat (Sans) & Playfair Display (Serif) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght=500;600;700&display=swap" rel="stylesheet">



    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>



    <!-- Iconify -->

    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>



    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: '#5802f7',

                        dark: '#1a1a1a',

                    },

                    fontFamily: {

                        sans: ['Montserrat', 'sans-serif'],

                        serif: ['Playfair Display', 'serif'],

                    }

                }

            }

        }

    </script>



    <style>

        .glass {

            background: rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.5);

        }

    </style>

</head>

<body class="bg-slate-50 text-slate-600 font-sans antialiased">

    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">

        <div class="w-full max-w-md p-8 space-y-8 glass rounded-2xl shadow-xl border border-slate-100">

            <div class="text-center">

                <div class="flex justify-center mb-6">

                    <div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">

                        <span class="text-lg font-semibold font-poppins">H</span>

                    </div>

                </div>

                <h1 class="text-3xl font-bold text-dark font-poppins">Réinitialiser le Mot de Passe</h1>

                <p class="text-slate-500 mt-2">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

            </div>



            <form method="post" action="{% url 'password_reset' %}">

                {% csrf_token %}



                <div class="space-y-6">

                    <div>

                        <label for="id_email" class="block text-sm font-medium text-slate-700 mb-1">Adresse e-mail</label>

                        <input type="email" name="email" id="id_email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all bg-white/80">

                        {% if form.email.errors %}

                            <p class="mt-1 text-sm text-rose-600">{{ form.email.errors.0 }}</p>

                        {% endif %}

                    </div>

                </div>



                <div class="flex justify-center mt-6">

                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-primary text-white text-sm font-medium shadow-lg shadow-primary/30 hover:shadow-primary/50 hover:-translate-y-0.5 transition-all">

                        Envoyer le Lien de Réinitialisation

                    </button>

                </div>

            </form>



            <div class="relative my-6">

                <div class="absolute inset-0 flex items-center">

                    <div class="w-full border-t border-slate-300"></div>

                </div>

                <div class="relative flex justify-center text-sm">

                    <span class="px-2 bg-slate-50 text-slate-500">Déjà inscrit ?</span>

                </div>

            </div>



            <div class="text-center">

                <a href="{% url 'login' %}" class="font-medium text-primary hover:text-primary/80">Se connecter</a>

            </div>

        </div>

    </div>

</body>

</html>
