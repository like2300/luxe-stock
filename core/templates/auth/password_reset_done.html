<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Réinitialisation Envoyée - Luxe</title>



    <!-- Fonts: Montserrat (Sans) & Playfair Display (Serif) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght=500;600;700&display=swap" rel="stylesheet">



    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>



    <!-- Iconify -->

    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>



    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: '#5802f7',

                        dark: '#1a1a1a',

                    },

                    fontFamily: {

                        sans: ['Montserrat', 'sans-serif'],

                        serif: ['Playfair Display', 'serif'],

                    }

                }

            }

        }

    </script>



    <style>

        .glass {

            background: rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.5);

        }

    </style>

</head>

<body class="bg-slate-50 text-slate-600 font-sans antialiased">

    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">

        <div class="w-full max-w-md p-8 space-y-8 glass rounded-2xl shadow-xl border border-slate-100 text-center">

            <div class="flex justify-center mb-6">

                <div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">

                    <iconify-icon icon="solar:check-circle-linear" width="32"></iconify-icon>

                </div>

            </div>

            <h1 class="text-3xl font-bold text-dark font-poppins">Lien de Réinitialisation Envoyé</h1>

            <p class="text-slate-500 mt-2">Un e-mail contenant un lien de réinitialisation a été envoyé à votre adresse.</p>



            <div class="mt-6">

                <a href="{% url 'login' %}" class="inline-flex items-center px-5 py-2.5 rounded-lg bg-primary text-white text-sm font-medium shadow-lg shadow-primary/30 hover:shadow-primary/50 hover:-translate-y-0.5 transition-all">

                    Retour à la Connexion

                </a>

            </div>

        </div>

    </div>

</body>

</html>
