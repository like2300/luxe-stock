{% extends "auth/base.html" %}
{% block page_title %}Mot de passe modifié — Stock{% endblock %}
{% block form_title %}Mot de passe modifié{% endblock %}

{% block content %}
<div class="text-center">
    <span class="inline-flex w-14 h-14 rounded-full bg-emerald-50 text-emerald-500 items-center justify-center mb-4">
        <i class="fa-solid fa-check text-xl"></i>
    </span>
    <p class="text-sm text-gray-500 leading-relaxed">
        Votre mot de passe a été enregistré. Vous pouvez maintenant vous connecter à votre espace.
    </p>

    <a href="{% url 'login' %}" class="mt-6 inline-flex w-full justify-center bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors shadow-sm">
        Se connecter
    </a>
</div>
{% endblock %}
