{% load static %}<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gestion de stock{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">STOCK</div>
  <h2>{% block heading %}{% endblock %}</h2>
  {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
  <form method="post">{% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="btn btn-primary block" type="submit">{% block submit %}Valider{% endblock %}</button>
  </form>
  <p class="auth-alt">{% block alt %}{% endblock %}</p>
  {% block google %}{% endblock %}
</div></body></html>
