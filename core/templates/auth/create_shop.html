<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une Boutique - Luxe</title>
    
    <!-- Fonts: Montserrat (Sans) & Playfair Display (Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght=500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5802f7',
                        dark: '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-600 font-sans antialiased">
    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
        <div class="w-full max-w-md p-8 space-y-8 glass rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center">
                <div class="flex justify-center mb-6">
                    <div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/30">
                        <span class="text-lg font-semibold font-poppins">H</span>
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-dark font-poppins">Créer une Boutique</h1>
                <p class="text-slate-500 mt-2">Configurez votre boutique pour commencer.</p>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-700">
                    {% for e in form.non_field_errors %}<p>{{ e }}</p>{% endfor %}
                </div>
                {% endif %}
                <div class="space-y-6">
                    <div>
                        <label for="id_name" class="block text-sm font-medium text-slate-700 mb-1">Nom de la Boutique *</label>
                        <input type="text" name="name" id="id_name" required value="{{ form.name.value|default:'' }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white/80">
                        {% if form.name.errors %}
                            <p class="mt-1 text-sm text-rose-600">{{ form.name.errors.0 }}</p>
                        {% endif %}
                    </div>
                    
                    <div>
                    <label for="id_address" class="block text-sm font-medium text-slate-700 mb-1">Adresse (facultatif)</label>
                        <input type="text" name="address" id="id_address" value="{{ form.address.value|default:'' }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white/80">
                    </div>
                    
                    <div>
                    <label for="id_phone" class="block text-sm font-medium text-slate-700 mb-1">Téléphone (facultatif)</label>
                        <input type="text" name="phone" id="id_phone" value="{{ form.phone.value|default:'' }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white/80">
                    </div>
                    <div>
                    <label for="id_currency" class="block text-sm font-medium text-slate-700 mb-1">Devise</label>
                        <input type="text" name="currency" id="id_currency" value="{{ form.currency.value|default:'FCFA' }}" class="w-full px-4 py-3 rounded-lg border border-slate-300 bg-white/80">
                    </div>
                    
                    <div>
                    <label for="id_logo" class="block text-sm font-medium text-slate-700 mb-1">Logo (facultatif)</label>
                        <input type="file" name="logo" id="id_logo" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary/90">
                    </div>
                    
                    <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Couleurs</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                            <label for="id_primary_color" class="block text-xs font-medium text-slate-500 mb-1">Couleur Principale</label>
                                <input type="color" name="primary_color" id="id_primary_color" value="{{ form.primary_color.value|default:'#5bc0de' }}" class="w-full h-10 p-1 rounded-lg border border-slate-300">
                            </div>
                            <div>
                            <label for="id_sidebar_color" class="block text-xs font-medium text-slate-500 mb-1">Couleur Menu</label>
                                <input type="color" name="sidebar_color" id="id_sidebar_color" value="{{ form.sidebar_color.value|default:'#3d4b5c' }}" class="w-full h-10 p-1 rounded-lg border border-slate-300">
                            </div>
                            <div>
                            <label for="id_header_color" class="block text-xs font-medium text-slate-500 mb-1">Couleur En-têtes</label>
                                <input type="color" name="header_color" id="id_header_color" value="{{ form.header_color.value|default:'#4a5868' }}" class="w-full h-10 p-1 rounded-lg border border-slate-300">
                            </div>
                            <div>
                            <label for="id_background_color" class="block text-xs font-medium text-slate-500 mb-1">Couleur Fond</label>
                                <input type="color" name="background_color" id="id_background_color" value="{{ form.background_color.value|default:'#e9edf4' }}" class="w-full h-10 p-1 rounded-lg border border-slate-300">
                            </div>
                        </div>
                    </div>
                    
                    <div>
                    <button type="submit" class="w-full flex justify-center px-4 py-3 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all">
                            Créer la Boutique
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
